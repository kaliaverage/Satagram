name: Build Satagram IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Telegram API
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          api_id = os.environ.get('TELEGRAM_API_ID', '')
          api_hash = os.environ.get('TELEGRAM_API_HASH', '')
          if not api_id.isdecimal() or len(api_hash) != 32 or any(c not in '0123456789abcdefABCDEF' for c in api_hash):
              sys.exit('Set GitHub Actions secrets TELEGRAM_API_ID and TELEGRAM_API_HASH before running this workflow.')
          with open('build-system/appstore-configuration.json') as f:
              config = json.load(f)
          config['api_id'] = api_id
          config['api_hash'] = api_hash
          config['is_appstore_build'] = 'false'
          config['appstore_id'] = '0'
          config['premium_iap_product_id'] = ''
          config['enable_siri'] = False
          config['enable_icloud'] = False
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'satagram-config.json'), 'w') as f:
              json.dump(config, f)
          PY

      - name: Import test signing identity
        run: python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: Refresh test provisioning profiles
        run: python3 build-system/Make/RefreshVerificationProfiles.py

      - name: Build device IPA
        run: |
          python3 -u build-system/Make/Make.py build \
            --configurationPath="$RUNNER_TEMP/satagram-config.json" \
            --codesigningInformationPath="$RUNNER_TEMP/satagram-test-signing" \
            --configuration=release_arm64 \
            --buildNumber="$GITHUB_RUN_NUMBER"
          cp bazel-bin/Telegram/Telegram.ipa "$RUNNER_TEMP/Satagram.ipa"

      - name: Upload IPA for Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: Satagram-IPA
          path: ${{ runner.temp }}/Satagram.ipa
          if-no-files-found: error
          retention-days: 7
